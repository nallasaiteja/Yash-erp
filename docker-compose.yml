name: yash-erp

services:
  db:
    image: postgres:16-alpine
    container_name: yash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: yash_erp
      POSTGRES_USER: yash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yash}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yash -d yash_erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: yash-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://yash:${POSTGRES_PASSWORD:-yash}@db:5432/yash_erp
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yashpowertech.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
